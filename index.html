<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOCK SOLID TEAK FURNITURE - Masuk</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" defer></script>
</head>
<body>
  <!-- ============ HALAMAN LOGIN (terpisah dari aplikasi) ============ -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo" aria-label="Logo Solid Teak">
        <img src="assets/solid-teak-logo.png" alt="Solid Teak Furniture">
      </div>
      <h1>STOCK SOLID TEAK FURNITURE</h1>
      <p class="login-sub">Sistem monitoring gudang, produksi & pengrajin</p>
      <form id="loginForm" autocomplete="off">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="mis. admin" required>
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="********" required>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>
    </div>
  </div>

  <div id="toastRoot" class="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js?v=36"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js?v=36"></script>
</body>
</html>
