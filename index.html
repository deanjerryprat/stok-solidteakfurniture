<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stok Furniture - Sistem Manajemen Gudang & Pengrajin</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Opsional: untuk export .xlsx & .pdf. Jika tidak terhubung internet, aplikasi otomatis pakai CSV & Print-to-PDF. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" defer></script>
</head>
<body>
  <!-- ============ LAYAR LOGIN ============ -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">🪑</div>
      <h1>Stok Furniture</h1>
      <p class="login-sub">Sistem monitoring gudang, produksi & pengrajin</p>
      <form id="loginForm" autocomplete="off">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="mis. admin" required>
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>
      <div class="login-hint">
        <strong>Akun demo:</strong><br>
        admin / admin123 · gudang / gudang123 · purchasing / purchasing123<br>
        produksi / produksi123 · manager / manager123
      </div>
    </div>
  </div>

  <!-- ============ APLIKASI ============ -->
  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">🪑</span>
        <div><strong>Stok Furniture</strong><small>Manajemen Produksi</small></div>
      </div>
      <nav id="navMenu" class="nav-menu"></nav>
      <div class="sidebar-footer">
        <button id="backupBtn" class="btn btn-ghost btn-block btn-sm">💾 Backup data (.json)</button>
        <button id="restoreBtn" class="btn btn-ghost btn-block btn-sm" style="margin-top:6px">📂 Pulihkan data</button>
        <button id="resetDemoBtn" class="btn btn-ghost btn-block btn-sm" style="margin-top:6px">🔄 Reset data contoh</button>
        <input type="file" id="restoreFile" accept="application/json" hidden>
        <small>Data tersimpan di browser ini</small>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button id="menuToggle" class="icon-btn menu-toggle" aria-label="Menu">☰</button>
        <div class="global-search">
          <span>🔍</span>
          <input type="text" id="globalSearchInput" placeholder="Cari SKU, nama produk, pengrajin, atau tanggal...">
        </div>
        <button id="notifBtn" class="icon-btn" title="Notifikasi">🔔 <span id="notifBadge" class="badge-dot" hidden></span></button>
        <div class="user-chip" id="userChip"></div>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Keluar</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/views2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
