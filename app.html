<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STOCK SOLID TEAK FURNITURE — Aplikasi</title>
  <link rel="stylesheet" href="styles.css?v=25">
  <!-- Opsional: untuk export .xlsx & .pdf. Jika tidak terhubung internet, aplikasi otomatis pakai CSV & Print-to-PDF. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" defer></script>
</head>
<body>
  <!-- ============ APLIKASI (hanya bisa dibuka setelah login) ============ -->
  <div id="appShell" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/solid-teak-logo.png" alt="Solid Teak" class="brand-logo">
        <div><strong>STOCK SOLID TEAK</strong><small>FURNITURE</small></div>
      </div>
      <nav id="navMenu" class="nav-menu"></nav>
      <div class="sidebar-footer">
        <button id="backupBtn" class="btn btn-ghost btn-block btn-sm">💾 Backup data (.json)</button>
        <button id="restoreBtn" class="btn btn-ghost btn-block btn-sm" style="margin-top:6px">📂 Pulihkan data</button>
        <button id="resetDemoBtn" class="btn btn-ghost btn-block btn-sm" style="margin-top:6px">🔄 Reset data contoh</button>
        <input type="file" id="restoreFile" accept="application/json" hidden>
        <small>Data tersimpan di browser ini</small>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button id="menuToggle" class="icon-btn menu-toggle" aria-label="Menu">☰</button>
        <div class="global-search">
          <span>🔍</span>
          <input type="text" id="globalSearchInput" placeholder="Cari SKU, nama produk, pengrajin, atau tanggal...">
        </div>
        <button id="notifBtn" class="icon-btn" title="Notifikasi">🔔 <span id="notifBadge" class="badge-dot" hidden></span></button>
        <div class="user-chip" id="userChip"></div>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Keluar</button>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="js/config.js?v=25"></script>
  <script src="js/utils.js?v=25"></script>
  <script src="js/store.js?v=25"></script>
  <script src="js/ui.js?v=25"></script>
  <script src="js/views.js?v=25"></script>
  <script src="js/views2.js?v=25"></script>
  <script src="js/app.js?v=25"></script>
</body>
</html>
